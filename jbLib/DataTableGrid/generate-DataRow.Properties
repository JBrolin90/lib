#!/bin/bash

OUTPUT_FILE="ObservableDataRow.Properties.cs"

cat << 'HEADER' > "$OUTPUT_FILE"
// Auto-generated - Do not edit manually
// Generated: TIMESTAMP

using System;
using System.Data;

namespace jbLib.DataTableGrid
{
    public partial class ObservableDataRow
    {
HEADER

# Replace timestamp
sed -i "s/TIMESTAMP/$(date)/" "$OUTPUT_FILE"

# Generate properties
for i in $(seq 0 255); do
cat << EOF >> "$OUTPUT_FILE"
        public int? Int$i { get => GetValue<int>($i); set => SetValue($i, value); }
        public string? String$i { get => GetRefValue<string>($i); set => SetRefValue($i, value); }
        public double? Double$i { get => GetValue<double>($i); set => SetValue($i, value); }
        public DateTime? DateTime$i { get => GetValue<DateTime>($i); set => SetValue($i, value); }

EOF
done

# Close class and namespace
cat << 'FOOTER' >> "$OUTPUT_FILE"
    }
}
FOOTER

